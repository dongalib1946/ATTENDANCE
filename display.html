<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>근로학생 QR</title>
  <link rel="stylesheet" href="./styles.css?v=20260903-cache-bump-1">
</head>
<body class="display-body">
  <a class="admin-corner-link" href="./admin.html?v=20260903-cache-bump-1" aria-label="관리자 페이지로 이동">관리자</a>

  <main class="display-shell">
    <section class="display-copy">
      <div class="system-masthead" aria-label="시스템 이름">
        <span>동아대학교 도서관</span>
        <strong>근로장학생<br>출퇴근 시스템</strong>
      </div>
      <div class="clock-block" aria-label="현재 날짜와 시간">
        <time class="display-time" id="displayTime">--:--:--</time>
        <time class="display-date" id="displayDate">----</time>
      </div>
      <h1>QR코드를 스캔하세요.</h1>
      <p class="display-status" id="displayStatus">QR 코드를 준비하고 있습니다.</p>
    </section>

    <section class="recent-stage" id="recentStage" aria-label="최근 출퇴근 처리 내역" hidden>
      <div class="recent-heading">
        <div class="recent-title">
          <strong>최근 출퇴근</strong>
          <span>화면 반영까지 잠시 지연될 수 있습니다.</span>
        </div>
        <div class="recent-actions">
          <button class="recent-sound-button" id="recentSoundButton" type="button" aria-pressed="false">음성 켜기</button>
          <time id="recentUpdated">불러오는 중</time>
        </div>
      </div>
      <div class="recent-list" id="recentList"></div>
    </section>

    <section class="qr-stage" aria-label="현재 출퇴근 QR 코드">
      <div class="qr-canvas" id="qrCode">
        <div class="qr-placeholder">
          <div class="spinner" aria-hidden="true"></div>
          <span>QR 생성 중</span>
        </div>
      </div>
      <div class="qr-meta connection-panel" id="connectionPanel" data-status="checking">
        <span class="connection-state">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionLabel">연결 확인 중</span>
        </span>
        <strong id="connectionChecked">확인 대기</strong>
      </div>
    </section>

    <section class="schedule-stage" aria-label="상호대차 담당자">
      <div class="schedule-heading">
        <div>
          <strong>상호대차 담당자</strong>
        </div>
        <button class="schedule-refresh-button" id="scheduleRefreshButton" type="button" aria-label="상호대차 담당자 새로 불러오기" title="새로 불러오기">↻</button>
        <time id="scheduleUpdated">불러오는 중</time>
      </div>
      <div class="schedule-table-wrap">
        <table class="schedule-table">
          <thead>
            <tr>
              <th scope="col">타임</th>
              <th scope="col">담당자</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./config.js?v=20260903-cache-bump-1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./shared.js?v=20260903-cache-bump-1"></script>
  <script>
    const qrCode = document.getElementById("qrCode");
    const displayStatus = document.getElementById("displayStatus");
    const displayTime = document.getElementById("displayTime");
    const displayDate = document.getElementById("displayDate");
    const connectionPanel = document.getElementById("connectionPanel");
    const connectionLabel = document.getElementById("connectionLabel");
    const connectionChecked = document.getElementById("connectionChecked");
    const scheduleBody = document.getElementById("scheduleBody");
    const scheduleUpdated = document.getElementById("scheduleUpdated");
    const scheduleRefreshButton = document.getElementById("scheduleRefreshButton");
    const recentStage = document.getElementById("recentStage");
    const recentList = document.getElementById("recentList");
    const recentUpdated = document.getElementById("recentUpdated");
    const recentSoundButton = document.getElementById("recentSoundButton");
    let lastToken = "";
    let renderInFlight = false;
    let scheduleInFlight = false;
    let recentLogsInFlight = false;
    let scheduleDayKey = getScheduleDayKey();
    let lastScheduleSignature = "";
    let lastRecentLogsSignature = "";
    let hasScheduleLoaded = false;
    let hasRecentLogsLoaded = false;
    let retryTimer = null;
    let qrLibraryPromise = null;
    let recentSoundEnabled = false;
    let recentSoundContext = null;

    function updateClock() {
      const now = new Date();
      displayTime.textContent = new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);
      displayDate.textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);
    }

    function ensureQrLibrary() {
      if (window.QRCode) return Promise.resolve();
      if (qrLibraryPromise) return qrLibraryPromise;

      qrLibraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timeoutId = setTimeout(() => {
          script.remove();
          reject(new Error("QR 생성 라이브러리 연결이 지연되고 있습니다."));
        }, 8000);

        script.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
        script.async = true;
        script.onload = () => {
          clearTimeout(timeoutId);
          if (window.QRCode) {
            resolve();
          } else {
            reject(new Error("QR 생성 라이브러리를 사용할 수 없습니다."));
          }
        };
        script.onerror = () => {
          clearTimeout(timeoutId);
          reject(new Error("QR 생성 라이브러리를 불러오지 못했습니다."));
        };
        document.head.appendChild(script);
      }).catch((error) => {
        qrLibraryPromise = null;
        throw error;
      });

      return qrLibraryPromise;
    }

    function scheduleQrRetry(delayMs) {
      if (retryTimer) return;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        renderQr();
      }, delayMs);
    }

    function formatCurrentTime() {
      return new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
    }

    function setConnectionStatus(status, label) {
      connectionPanel.dataset.status = status;
      connectionLabel.textContent = label;
      connectionChecked.textContent = `${formatCurrentTime()} 확인`;
    }

    async function renderQr() {
      if (renderInFlight) return;
      renderInFlight = true;

      try {
        await ensureQrLibrary();
        const data = await AttendanceApi.call("qr");
        if (!data.ok) throw new Error(data.message || "QR을 만들 수 없습니다.");

        if (data.token !== lastToken) {
          qrCode.innerHTML = "";
          new window.QRCode(qrCode, {
            text: data.scanUrl,
            width: 520,
            height: 520,
            colorDark: "#10231f",
            colorLight: "#ffffff",
            correctLevel: window.QRCode.CorrectLevel.M
          });
          lastToken = data.token;
        }

        displayStatus.textContent = "스캔 후 근무 위치와 이름을 선택하고 출근 또는 퇴근을 누르세요.";
        setConnectionStatus("ok", "연결 정상");
        if (retryTimer) {
          clearTimeout(retryTimer);
          retryTimer = null;
        }
      } catch (error) {
        displayStatus.textContent = error.message;
        setConnectionStatus("error", "연결 재시도 중");
        if (!lastToken) {
          qrCode.innerHTML = '<div class="qr-placeholder"><span>QR 연결 재시도 중</span></div>';
        }
        scheduleQrRetry(5000);
      } finally {
        renderInFlight = false;
      }
    }

    function buildDefaultScheduleSlots() {
      return ["1타임", "2타임", "3타임"].map((label) => ({
        label,
        staff: "",
        note: ""
      }));
    }

    function renderSchedule(slots) {
      scheduleBody.innerHTML = "";
      slots.forEach((slot) => {
        const row = document.createElement("tr");

        const labelCell = document.createElement("th");
        labelCell.scope = "row";
        labelCell.textContent = slot.label || "-";

        const staffCell = document.createElement("td");
        staffCell.textContent = slot.staff || "-";

        row.append(labelCell, staffCell);
        scheduleBody.appendChild(row);
      });
    }

    function formatRecentTime(recordedAt) {
      const text = String(recordedAt || "");
      const match = text.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\b/);
      if (!match) return text;

      const hour = Number(match[1]);
      if (!Number.isFinite(hour)) return text;

      const period = hour < 12 ? "오전" : "오후";
      const hour12 = hour % 12 || 12;
      return `${period} ${hour12}:${match[2]}`;
    }

    function renderRecentLogs(entries) {
      recentList.innerHTML = "";
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "recent-empty";
        empty.textContent = "최근 처리 내역이 없습니다.";
        recentList.appendChild(empty);
        return;
      }

      entries.slice(0, 3).forEach((entry) => {
        const item = document.createElement("article");
        const kind = entry.kindLabel || "-";
        item.className = "recent-item" + (kind === "퇴근" ? " is-out" : "");

        const kindBadge = document.createElement("span");
        kindBadge.className = "recent-kind";
        kindBadge.textContent = kind;

        const name = document.createElement("strong");
        name.textContent = entry.name || "-";

        const meta = document.createElement("span");
        meta.className = "recent-meta";
        meta.textContent = [entry.floor, formatRecentTime(entry.recordedAt)].filter(Boolean).join(" · ");

        item.append(kindBadge, name, meta);
        recentList.appendChild(item);
      });
    }

    function getRecentSoundContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!recentSoundContext) recentSoundContext = new AudioContextClass();
      if (recentSoundContext.state === "suspended") {
        recentSoundContext.resume().catch(() => {});
      }
      return recentSoundContext;
    }

    function playRecentTone(context, frequency, start, duration, volume) {
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.04);
    }

    function getRecentKindLabel(kindLabel) {
      const text = String(kindLabel || "");
      if (text.indexOf("퇴근") !== -1) return "퇴근";
      if (text.indexOf("출근") !== -1) return "출근";
      return "";
    }

    function getKoreanSpeechVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find((voice) => String(voice.lang || "").toLowerCase().startsWith("ko"))
        || voices.find((voice) => /korean|한국|ko/i.test(String(voice.name || "")))
        || null;
    }

    function speakRecentKind(kindLabel) {
      if (!recentSoundEnabled) return;
      if (!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) return;

      const kind = getRecentKindLabel(kindLabel);
      if (!kind) return;

      const utterance = new SpeechSynthesisUtterance(kind);
      const voice = getKoreanSpeechVoice();
      utterance.lang = "ko-KR";
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      utterance.volume = 1;
      if (voice) utterance.voice = voice;

      window.speechSynthesis.cancel();
      window.setTimeout(() => window.speechSynthesis.speak(utterance), 120);
    }

    function playRecentLogSound(kindLabel) {
      const context = getRecentSoundContext();
      if (context) {
        const start = context.currentTime;
        playRecentTone(context, 880, start, 0.14, 0.11);
        playRecentTone(context, 1174.66, start + 0.16, 0.18, 0.1);
      }
      speakRecentKind(kindLabel);
    }

    function enableRecentLogSound() {
      const context = getRecentSoundContext();
      const hasSpeech = "speechSynthesis" in window && Boolean(window.SpeechSynthesisUtterance);
      if (!context && !hasSpeech) {
        recentSoundButton.textContent = "음성 미지원";
        recentSoundButton.disabled = true;
        return;
      }
      recentSoundEnabled = true;
      if (hasSpeech) window.speechSynthesis.getVoices();
      recentSoundButton.textContent = hasSpeech ? "음성 켜짐" : "효과음 켜짐";
      recentSoundButton.setAttribute("aria-pressed", "true");
      playRecentLogSound();
    }

    async function loadRecentLogs(options = {}) {
      if (recentLogsInFlight) return;
      recentLogsInFlight = true;

      try {
        const params = options.force ? { refresh: "1" } : {};
        const data = await AttendanceApi.call("recentLogs", params);
        if (!data.ok) throw new Error(data.message || "최근 출퇴근 기록을 불러오지 못했습니다.");
        const entries = Array.isArray(data.entries) ? data.entries : [];
        const signature = JSON.stringify(entries.map((entry) => ({
          name: entry.name || "",
          recordedAt: entry.recordedAt || "",
          kindLabel: entry.kindLabel || "",
          floor: entry.floor || ""
        })));
        if (signature !== lastRecentLogsSignature) {
          const shouldPlaySound = hasRecentLogsLoaded && entries.length > 0;
          renderRecentLogs(entries);
          lastRecentLogsSignature = signature;
          if (shouldPlaySound) playRecentLogSound(entries[0].kindLabel);
        }
        recentStage.hidden = false;
        hasRecentLogsLoaded = true;
        recentUpdated.textContent = data.updatedAt ? `${data.updatedAt} 기준` : "방금 갱신";
      } catch (error) {
        if (!hasRecentLogsLoaded) {
          recentStage.hidden = true;
          renderRecentLogs([]);
        } else {
          recentUpdated.textContent = "갱신 지연";
        }
      } finally {
        recentLogsInFlight = false;
      }
    }

    async function loadSchedule(options = {}) {
      if (scheduleInFlight) return;
      const isManualRefresh = Boolean(options.manual);
      scheduleInFlight = true;
      if (isManualRefresh) scheduleRefreshButton.disabled = true;

      try {
        const params = options.force ? { refresh: "1" } : {};
        const data = await AttendanceApi.call("schedule", params);
        if (!data.ok) throw new Error(data.message || "시간표를 불러오지 못했습니다.");
        const slots = Array.isArray(data.slots) && data.slots.length ? data.slots : buildDefaultScheduleSlots();
        const signature = JSON.stringify(slots.map((slot) => ({
          label: slot.label || "",
          staff: slot.staff || "",
          note: slot.note || ""
        })));
        if (signature !== lastScheduleSignature) {
          renderSchedule(slots);
          lastScheduleSignature = signature;
        }
        hasScheduleLoaded = true;
        scheduleUpdated.textContent = data.updatedAt ? `${data.updatedAt} 기준` : "방금 갱신";
      } catch (error) {
        if (!hasScheduleLoaded) renderSchedule(buildDefaultScheduleSlots());
        scheduleUpdated.textContent = "불러오기 실패";
      } finally {
        scheduleInFlight = false;
        scheduleRefreshButton.disabled = false;
      }
    }

    function getScheduleDayKey() {
      return new Intl.DateTimeFormat("sv-SE", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function refreshScheduleOnDayChange() {
      const nextDayKey = getScheduleDayKey();
      if (nextDayKey === scheduleDayKey) return;
      scheduleDayKey = nextDayKey;
      loadSchedule({ force: true });
    }

    updateClock();
    setInterval(updateClock, 1000);
    renderQr();
    loadSchedule();
    loadRecentLogs({ force: true });
    recentSoundButton.addEventListener("click", enableRecentLogSound);
    scheduleRefreshButton.addEventListener("click", () => loadSchedule({ force: true, manual: true }));
    setInterval(renderQr, 30000);
    setInterval(loadSchedule, 60 * 1000);
    setInterval(loadRecentLogs, 2 * 1000);
    setInterval(refreshScheduleOnDayChange, 60 * 1000);
  </script>
</body>
</html>
