<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>근로학생 QR</title>
  <link rel="stylesheet" href="./styles.css?v=20260831-interloan-1">
</head>
<body class="display-body">
  <a class="admin-corner-link" href="./admin.html?v=20260831-interloan-1" aria-label="관리자 페이지로 이동">관리자</a>

  <main class="display-shell">
    <section class="display-copy">
      <div class="system-masthead" aria-label="시스템 이름">
        <span>동아대학교 도서관</span>
        <strong>근로장학생<br>출퇴근 시스템</strong>
      </div>
      <div class="clock-block" aria-label="현재 날짜와 시간">
        <time class="display-time" id="displayTime">--:--:--</time>
        <time class="display-date" id="displayDate">----</time>
      </div>
      <h1>QR코드를 스캔하세요.</h1>
      <p class="display-status" id="displayStatus">QR 코드를 준비하고 있습니다.</p>
    </section>

    <section class="qr-stage" aria-label="현재 출퇴근 QR 코드">
      <div class="qr-canvas" id="qrCode">
        <div class="qr-placeholder">
          <div class="spinner" aria-hidden="true"></div>
          <span>QR 생성 중</span>
        </div>
      </div>
      <div class="qr-meta">
        <span id="slotLabel">QR 정보 확인 중</span>
        <strong id="nextChange">다음 변경 확인 중</strong>
      </div>
    </section>

    <section class="schedule-stage" aria-label="상호대차 담당자">
      <div class="schedule-heading">
        <div>
          <strong>상호대차 담당자</strong>
        </div>
        <time id="scheduleUpdated">불러오는 중</time>
      </div>
      <div class="schedule-table-wrap">
        <table class="schedule-table">
          <thead>
            <tr>
              <th scope="col">타임</th>
              <th scope="col">담당자</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./config.js?v=20260831-interloan-1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./shared.js?v=20260831-interloan-1"></script>
  <script>
    const qrCode = document.getElementById("qrCode");
    const displayStatus = document.getElementById("displayStatus");
    const displayTime = document.getElementById("displayTime");
    const displayDate = document.getElementById("displayDate");
    const slotLabel = document.getElementById("slotLabel");
    const nextChange = document.getElementById("nextChange");
    const scheduleBody = document.getElementById("scheduleBody");
    const scheduleUpdated = document.getElementById("scheduleUpdated");
    let lastToken = "";
    let renderInFlight = false;
    let scheduleInFlight = false;
    let retryTimer = null;
    let qrLibraryPromise = null;

    function updateClock() {
      const now = new Date();
      displayTime.textContent = new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);
      displayDate.textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);
    }

    function ensureQrLibrary() {
      if (window.QRCode) return Promise.resolve();
      if (qrLibraryPromise) return qrLibraryPromise;

      qrLibraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timeoutId = setTimeout(() => {
          script.remove();
          reject(new Error("QR 생성 라이브러리 연결이 지연되고 있습니다."));
        }, 8000);

        script.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
        script.async = true;
        script.onload = () => {
          clearTimeout(timeoutId);
          if (window.QRCode) {
            resolve();
          } else {
            reject(new Error("QR 생성 라이브러리를 사용할 수 없습니다."));
          }
        };
        script.onerror = () => {
          clearTimeout(timeoutId);
          reject(new Error("QR 생성 라이브러리를 불러오지 못했습니다."));
        };
        document.head.appendChild(script);
      }).catch((error) => {
        qrLibraryPromise = null;
        throw error;
      });

      return qrLibraryPromise;
    }

    function scheduleQrRetry(delayMs) {
      if (retryTimer) return;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        renderQr();
      }, delayMs);
    }

    async function renderQr() {
      if (renderInFlight) return;
      renderInFlight = true;

      try {
        await ensureQrLibrary();
        const data = await AttendanceApi.call("qr");
        if (!data.ok) throw new Error(data.message || "QR을 만들 수 없습니다.");

        if (data.token !== lastToken) {
          qrCode.innerHTML = "";
          new window.QRCode(qrCode, {
            text: data.scanUrl,
            width: 520,
            height: 520,
            colorDark: "#10231f",
            colorLight: "#ffffff",
            correctLevel: window.QRCode.CorrectLevel.M
          });
          lastToken = data.token;
        }

        displayStatus.textContent = "스캔 후 근무 위치와 이름을 선택하고 출근 또는 퇴근을 누르세요.";
        slotLabel.textContent = data.slotLabel;
        nextChange.textContent = `다음 변경: ${data.nextChangeAt}`;
        if (retryTimer) {
          clearTimeout(retryTimer);
          retryTimer = null;
        }
      } catch (error) {
        displayStatus.textContent = error.message;
        slotLabel.textContent = "연결 재시도 중";
        nextChange.textContent = "잠시 후 자동으로 다시 시도합니다";
        if (!lastToken) {
          qrCode.innerHTML = '<div class="qr-placeholder"><span>QR 연결 재시도 중</span></div>';
        }
        scheduleQrRetry(5000);
      } finally {
        renderInFlight = false;
      }
    }

    function buildDefaultScheduleSlots() {
      return ["1타임", "2타임", "3타임"].map((label) => ({
        label,
        staff: "",
        note: ""
      }));
    }

    function buildPreviewScheduleSlots() {
      return [
        { label: "1타임", staff: "홍길동", note: "" },
        { label: "2타임", staff: "김학생", note: "" },
        { label: "3타임", staff: "이근로", note: "" }
      ];
    }

    function isLocalPreview() {
      return ["localhost", "127.0.0.1"].includes(window.location.hostname);
    }

    function renderSchedule(slots) {
      scheduleBody.innerHTML = "";
      slots.forEach((slot) => {
        const row = document.createElement("tr");

        const labelCell = document.createElement("th");
        labelCell.scope = "row";
        labelCell.textContent = slot.label || "-";

        const staffCell = document.createElement("td");
        staffCell.textContent = slot.staff || "-";

        row.append(labelCell, staffCell);
        scheduleBody.appendChild(row);
      });
    }

    async function loadSchedule() {
      if (scheduleInFlight) return;
      scheduleInFlight = true;

      try {
        const data = await AttendanceApi.call("schedule");
        if (!data.ok) throw new Error(data.message || "시간표를 불러오지 못했습니다.");
        const slots = Array.isArray(data.slots) && data.slots.length ? data.slots : buildDefaultScheduleSlots();
        renderSchedule(slots);
        scheduleUpdated.textContent = data.updatedAt ? `${data.updatedAt} 기준` : "방금 갱신";
      } catch (error) {
        renderSchedule(isLocalPreview() ? buildPreviewScheduleSlots() : buildDefaultScheduleSlots());
        scheduleUpdated.textContent = "연결 대기";
      } finally {
        scheduleInFlight = false;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
    renderQr();
    loadSchedule();
    setInterval(renderQr, 30000);
    setInterval(loadSchedule, 300000);
  </script>
</body>
</html>
